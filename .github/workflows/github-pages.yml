# Деплой клиентского портала (docs/) на GitHub Pages
# Вариант 1: публикует в ветку gh-pages (проще включить в Settings)
name: Deploy client portal to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подставить URL API
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          node -e "
          const api = process.env.API_PUBLIC_URL || 'http://localhost:3000';
          require('fs').writeFileSync('docs/js/config.js',
            'window.PORTAL_CONFIG = ' + JSON.stringify({ apiBase: api }, null, 2) + ';\n');
          console.log('API для портала:', api);
          "

      - name: Публикация в ветку gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          force_orphan: true
